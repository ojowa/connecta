version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: connecta-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: connecta_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Aarinola
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: connecta-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connecta-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:Aarinola@postgres:5432/connecta_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-connecta-dev-jwt-secret-2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-connecta-dev-refresh-secret-2026}
      - AUTH_SERVICE_URL=http://localhost:3001
      - USERS_SERVICE_URL=http://localhost:3002
      - MATCHING_SERVICE_URL=http://localhost:3003
      - CHAT_SERVICE_URL=http://localhost:3004
      - CALLS_SERVICE_URL=http://localhost:3005
      - MEDIA_SERVICE_URL=http://localhost:3006
      - PAYMENTS_SERVICE_URL=http://localhost:3007
      - NOTIFICATIONS_SERVICE_URL=http://localhost:3008
      - SEARCH_SERVICE_URL=http://localhost:3009
      - CONTENT_SERVICE_URL=http://localhost:3010
      - SUPPORT_SERVICE_URL=http://localhost:3011
      - ADMIN_SERVICE_URL=http://localhost:3012
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
