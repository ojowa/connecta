services:
  - type: web
    name: ojchat
    runtime: node
    rootDir: backend
    plan: free
    healthCheckPath: /v1/health
    buildCommand: npm install && npm run build:all
    startCommand: npm run start:monolith
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"