services:
  - type: web
    name: ojchat
    runtime: node
    rootDir: backend
    plan: free
    healthCheckPath: /v1/health
    buildCommand: npm install && npm run build:monolith
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"