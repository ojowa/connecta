name: Build and Deploy Backend to Azure Web App - ojchatapi

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '!apps/admin-web/**'
      - 'libs/**'
      - 'migrations/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'nest-cli.json'
      - 'ormconfig.ts'
      - '.github/workflows/main_ojchatapi.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all services
        run: npm run build:all > build.log 2>&1 || true

      - name: Install production dependencies for deployment
        run: npm ci --omit=dev

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            package*.json
            libs
            node_modules
          retention-days: 1

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ojchatapi'
          slot-name: 'Production'
          package: .
          startup-command: npx concurrently --names gw,auth,usr,match,chat,call,media,pay,notif,search,content,support,admin --kill-others "node -r tsconfig-paths/register dist/apps/api-gateway/src/main.js" "node -r tsconfig-paths/register dist/apps/auth-service/src/main.js" "node -r tsconfig-paths/register dist/apps/users-service/src/main.js" "node -r tsconfig-paths/register dist/apps/matching-service/src/main.js" "node -r tsconfig-paths/register dist/apps/chat-service/src/main.js" "node -r tsconfig-paths/register dist/apps/calls-service/src/main.js" "node -r tsconfig-paths/register dist/apps/media-service/src/main.js" "node -r tsconfig-paths/register dist/apps/payments-service/src/main.js" "node -r tsconfig-paths/register dist/apps/notifications-service/src/main.js" "node -r tsconfig-paths/register dist/apps/search-service/src/main.js" "node -r tsconfig-paths/register dist/apps/content-service/src/main.js" "node -r tsconfig-paths/register dist/apps/support-service/src/main.js" "node -r tsconfig-paths/register dist/apps/admin-service/src/main.js"

      - name: Configure App Settings
        run: |
          az webapp config appsettings set \
            --name ojchatapi \
            --resource-group ojchat-rg \
            --settings \
              NODE_ENV=production \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              REDIS_URL="${{ secrets.REDIS_URL }}" \
              ADMIN_JWT_SECRET="${{ secrets.ADMIN_JWT_SECRET }}" \
              EXPO_PUSH_TOKEN="${{ secrets.EXPO_PUSH_TOKEN }}"

      - name: Run Database Migrations
        run: |
          az webapp ssh --name ojchatapi --resource-group ojchat-rg --command "npm run migration:run"