name: Deploy Backend to Azure App Service (Node.js 24 LTS)

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '!apps/admin-web/**'
      - 'libs/**'
      - 'migrations/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'nest-cli.json'
      - 'ormconfig.ts'
      - '.github/workflows/azure-backend-deploy.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ojchat-backend
  AZURE_WEBAPP_RESOURCE_GROUP: ojchat-rg
  NODE_VERSION: '24.x'

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all services
        run: npm run build:all

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            package*.json
            libs
            node_modules/tsconfig-paths
            node_modules/concurrently
            node_modules/.bin/concurrently
          retention-days: 1

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group: ${{ env.AZURE_WEBAPP_RESOURCE_GROUP }}
          package: .
          startup-command: npx concurrently --names gw,auth,usr,match,chat,call,media,pay,notif,search,content,support,admin --kill-others "node -r tsconfig-paths/register dist/apps/api-gateway/src/main.js" "node -r tsconfig-paths/register dist/apps/auth-service/src/main.js" "node -r tsconfig-paths/register dist/apps/users-service/src/main.js" "node -r tsconfig-paths/register dist/apps/matching-service/src/main.js" "node -r tsconfig-paths/register dist/apps/chat-service/src/main.js" "node -r tsconfig-paths/register dist/apps/calls-service/src/main.js" "node -r tsconfig-paths/register dist/apps/media-service/src/main.js" "node -r tsconfig-paths/register dist/apps/payments-service/src/main.js" "node -r tsconfig-paths/register dist/apps/notifications-service/src/main.js" "node -r tsconfig-paths/register dist/apps/search-service/src/main.js" "node -r tsconfig-paths/register dist/apps/content-service/src/main.js" "node -r tsconfig-paths/register dist/apps/support-service/src/main.js" "node -r tsconfig-paths/register dist/apps/admin-service/src/main.js"

      - name: Configure App Settings
        run: |
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_WEBAPP_RESOURCE_GROUP }} \
            --settings \
              NODE_ENV=production \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              REDIS_URL="${{ secrets.REDIS_URL }}" \
              ADMIN_JWT_SECRET="${{ secrets.ADMIN_JWT_SECRET }}" \
              EXPO_PUSH_TOKEN="${{ secrets.EXPO_PUSH_TOKEN }}"

      - name: Run Database Migrations
        run: |
          az webapp ssh --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ${{ env.AZURE_WEBAPP_RESOURCE_GROUP }} --command "npm run migration:run"